<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Subscriptions — Admin</title>
    <style>
        :root { --ink:#0f2b46; --brand:#1d6df2; --hair:#e6eaf0; --muted:#64748b; --ground:#f4f6f9; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--ground); color: var(--ink); }
        .wrap { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
        .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 1.25rem; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.85rem; margin-bottom: 1.5rem; }
        .card { background: #fff; border: 1px solid var(--hair); border-radius: 12px; padding: 1rem 1.15rem; }
        .card .n { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
        .card .l { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-top: 0.3rem; }
        .card.mrr { background: linear-gradient(135deg,#0f2b46,#1d6df2); color: #fff; border: 0; }
        .card.mrr .l { color: #cfe0ff; }
        .tablewrap { background: #fff; border: 1px solid var(--hair); border-radius: 12px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
        th, td { text-align: left; padding: 0.7rem 0.9rem; border-bottom: 1px solid #f1f4f8; white-space: nowrap; }
        th { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); font-weight: 700; }
        td.num { text-align: right; font-variant-numeric: tabular-nums; }
        .pill { display: inline-block; font-size: 0.7rem; font-weight: 800; padding: 0.15rem 0.55rem; border-radius: 99px; text-transform: capitalize; }
        .s-active { background: #e9f9ef; color: #276749; } .s-trialing { background: #ebf4ff; color: #1a4fb0; }
        .s-past_due { background: #fffaf0; color: #b45309; } .s-canceling { background: #fff5f5; color: #c53030; }
        .s-canceled, .s-unpaid, .s-incomplete, .s-lookup_error { background: #f1f5f9; color: #64748b; }
        .kind { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .msg { padding: 3rem 1rem; text-align: center; color: var(--muted); }
        .reload { float: right; font: inherit; font-size: 0.82rem; font-weight: 700; color: var(--brand); background: none; border: 1px solid var(--hair); border-radius: 8px; padding: 0.4rem 0.85rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="wrap">
        <button class="reload" onclick="load()">↺ Refresh</button>
        <h1>Subscriptions &amp; MRR</h1>
        <p class="sub">Every subscription by state — reconciles live against Stripe. MRR normalizes annual plans to monthly.</p>
        <div class="cards" id="cards"></div>
        <div class="tablewrap"><div id="table"><div class="msg">Loading…</div></div></div>
    </div>
    <script>
        // Embed height reporting (when iframed into the admin shell).
        (function () {
            if (new URLSearchParams(location.search).get('embed') !== '1') return;
            let lastH = 0;
            setInterval(function () {
                const h = document.body.scrollHeight;
                if (h !== lastH) { lastH = h; try { window.parent.postMessage({ lt: 'height', frame: 'subscriptions', h }, '*'); } catch (_) {} }
            }, 400);
        })();

        const money = n => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const TIER = { basic: 'Standard', mn_lake_specialist: 'Prime', top_agent: 'Elite', premium: 'Premium', free: 'Free' };

        async function load() {
            const tbl = document.getElementById('table');
            try {
                const r = await fetch('/api/admin/subscriptions', { credentials: 'include' });
                if (r.status === 401 || r.status === 403) { tbl.innerHTML = '<div class="msg">Admin sign-in required.</div>'; return; }
                const d = await r.json();
                if (!d.configured) {
                    document.getElementById('cards').innerHTML = '';
                    tbl.innerHTML = '<div class="msg">Stripe isn\'t configured, so live subscription data is unavailable.</div>';
                    return;
                }
                const st = d.totals.byState || {};
                const order = ['active', 'trialing', 'past_due', 'canceling', 'canceled', 'free'];
                const cards = [`<div class="card mrr"><div class="n">${money(d.totals.mrr)}</div><div class="l">MRR (monthly)</div></div>`];
                order.forEach(k => { if (st[k] != null) cards.push(`<div class="card"><div class="n">${st[k]}</div><div class="l">${k.replace('_', ' ')}</div></div>`); });
                document.getElementById('cards').innerHTML = cards.join('');

                if (!d.rows.length) { tbl.innerHTML = '<div class="msg">No subscriptions on file yet.</div>'; return; }
                tbl.innerHTML = `<table><thead><tr>
                    <th>Name</th><th>Type</th><th>Tier</th><th>Lake</th><th>State</th>
                    <th class="num">Amount</th><th class="num">MRR</th><th>Next billing</th></tr></thead><tbody>${
                    d.rows.map(row => `<tr>
                        <td>${esc(row.name)}${row.comped ? ' <span class="kind">comped</span>' : ''}<div class="kind">${esc(row.email || '')}</div></td>
                        <td class="kind">${esc(row.kind)}</td>
                        <td>${esc(TIER[row.tier] || row.tier || '—')}</td>
                        <td>${esc(row.lake || '—')}</td>
                        <td><span class="pill s-${esc(row.state)}">${esc((row.state || '').replace('_', ' '))}</span></td>
                        <td class="num">${row.amount != null ? money(row.amount) + '/' + (row.interval === 'year' ? 'yr' : 'mo') : '—'}</td>
                        <td class="num">${row.mrr ? money(row.mrr) : '—'}</td>
                        <td>${row.current_period_end ? new Date(row.current_period_end).toLocaleDateString() : '—'}</td>
                    </tr>`).join('')
                }</tbody></table>`;
            } catch (e) {
                tbl.innerHTML = '<div class="msg">Couldn\'t load subscriptions. Refresh to try again.</div>';
            }
        }
        load();
    </script>
</body>
</html>
