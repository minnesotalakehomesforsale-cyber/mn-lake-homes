<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Leads Inbox | MN Lake Homes Admin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <link rel="stylesheet" href="../../styles/style.css">
<style>
        /* Admin layout base */
        html, body { margin: 0; padding: 0; background: #f7f9fa; font-family: 'SF Pro Text', sans-serif; color: #1a202c; }
        .filter-tab { padding: 0.75rem 1.25rem; border: none; background: transparent; font-weight: 600; color: #718096; border-bottom: 2px solid transparent; cursor: pointer; transition: all 0.2s; }
        .filter-tab:hover { color: #1a202c; }
        .filter-tab.active { color: var(--accent-blue); border-bottom-color: var(--accent-blue); }
        .filter-container { border-bottom: 1px solid #edf2f7; display: flex; gap: 0.5rem; margin-bottom: 2rem; overflow-x: auto; }
        .view-tab { padding: 0.7rem 1.15rem; border: none; background: transparent; font-weight: 800; font-size: 0.95rem; color: #94a3b8; border-bottom: 2px solid transparent; margin-bottom: -2px; cursor: pointer; }
        .view-tab.active { color: var(--accent-blue); border-bottom-color: var(--accent-blue); }
        .view-tab:hover { color: #1a202c; }
        .sys-frame { width: 100%; border: 0; min-height: 640px; display: block; }

        .ledger-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border: 1px solid #edf2f7; }
        .ledger-table th { background: #f7f9fa; padding: 1.25rem 1.5rem; text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #4a5568; border-bottom: 1px solid #edf2f7; font-weight: 700; }
        .ledger-table td { padding: 1.25rem 1.5rem; border-bottom: 1px solid #edf2f7; vertical-align: middle; color: #2d3748; font-weight: 500; font-size: 0.9rem; }
        .ledger-table tr:hover { background-color: #fcfcfc; cursor: pointer; }

        .s-badge { padding: 0.35rem 0.6rem; border-radius: 6px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; display: inline-block; }
        
        /* Status Badges */
        .status-new { background: #e6fffa; color: #319795; border: 1px solid #b2f5ea; }
        .status-unassigned { background: #fffaf0; color: #dd6b20; border: 1px solid #feebc8; }
        .status-assigned { background: #ebf8ff; color: #1d6df2; border: 1px solid #bee3f8; }
        .status-in_progress { background: #ebf4ff; color: #4c51bf; border: 1px solid #c3dafe; }
        
        /* Source Badges */
        .type-buyer { background: #f0fff4; color: #2f855a; }
        .type-seller { background: #faf5ff; color: #6b46c1; }
        .type-agent_inquiry { background: #fff5f5; color: #c53030; }
        .type-general { background: #edf2f7; color: #4a5568; }
    </style>
    <script src="../../components/admin-guard.js"></script>
    <script src="../../components/admin-responsive.js" defer></script>
    <script src="../../components/admin-sidebar.js" defer></script>
    <script src="../../components/admin-assistant.js" defer></script>
    <script src="../../components/admin-nav-badges.js" defer></script>
    <script src="../../components/admin-embed-host.js" defer></script>
</head>
<body style="background-color: #f7f9fa; color: #1a202c; margin: 0; padding: 0;">

    <div class="admin-wrap">
        <!-- Sidebar -->
        <admin-sidebar active="leads"></admin-sidebar>

        <!-- Main Content -->
        <main class="admin-main">
            <header style="margin-bottom: 2rem;">
                <h1 style="font-size: 2rem; font-weight: 800; color: #1a202c; letter-spacing: -1px; margin-bottom: 0.5rem;">Central Leads</h1>
                <p style="color: #718096; font-size: 1rem;">Centralized operational triage for all public endpoints.</p>
            </header>

            <!-- HubSpot setup — one-click provisioning (owner only). Safe to re-run. -->
            <div id="hs-setup" style="background:#fff;border:1px solid #e6eaf0;border-radius:14px;padding:1.1rem 1.35rem;margin-bottom:1.75rem;box-shadow:0 2px 8px rgba(16,24,40,0.04);">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;">
                    <div>
                        <div style="font-weight:800;color:#1a202c;font-size:1rem;">HubSpot setup</div>
                        <div style="color:#718096;font-size:0.88rem;margin-top:0.2rem;">Create/update the 4 lead-qualification properties + the Agent Acquisition deal pipeline. Safe to re-run.</div>
                    </div>
                    <button id="hsSetupBtn" onclick="runHubspotSetup()" style="background:#1d6df2;color:#fff;border:0;border-radius:9px;padding:0.7rem 1.25rem;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap;">Create / update HubSpot properties + pipeline</button>
                </div>
                <div id="hsSetupOut" style="margin-top:0.85rem;font-size:0.88rem;"></div>
            </div>
            <script>
                async function runHubspotSetup() {
                    var btn = document.getElementById('hsSetupBtn'), out = document.getElementById('hsSetupOut');
                    if (!confirm('Create/update the HubSpot properties + Agent Acquisition pipeline now?')) return;
                    btn.disabled = true; var orig = btn.textContent; btn.textContent = 'Working…';
                    out.innerHTML = '<span style="color:#718096;">Talking to HubSpot…</span>';
                    try {
                        var res = await fetch('/api/admin/hubspot/ensure-schema', { method: 'POST', credentials: 'include' });
                        var d = await res.json().catch(function () { return {}; });
                        if (res.status === 401 || res.status === 403) { out.innerHTML = '<span style="color:#c53030;">Sign in as the owner (super admin) to run this.</span>'; return; }
                        if (!res.ok || !d.ok) { out.innerHTML = '<span style="color:#c53030;">⚠️ ' + ((d && d.error) || 'Failed') + (/scope/i.test((d && d.error) || '') ? ' — add the crm.schemas.*.write scopes to your HubSpot private app, then retry.' : '') + '</span>'; return; }
                        var r = d.report;
                        var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); };
                        var line = function (label, x) { return '<div>' + label + ': <strong style="color:' + (x && x.action === 'error' ? '#c53030' : '#276749') + ';">' + esc(x && x.action || 'ok') + '</strong>' + (x && x.action === 'error' && x.error ? ' — ' + esc(x.error) : '') + (x && x.added && x.added.length ? ' (' + x.added.map(esc).join(', ') + ')' : '') + '</div>'; };
                        var errs = (r.errors || []).length;
                        var html = '<div style="color:' + (errs ? '#b7791f' : '#276749') + ';font-weight:700;margin-bottom:0.5rem;">' + (errs ? '⚠️ Completed with ' + errs + ' error(s) — everything else was created:' : '✓ Done — everything below now exists in HubSpot.') + '</div><div style="color:#4a5568;line-height:1.7;">';
                        html += line('Property group', r.contact_group);
                        (r.contact_properties || []).forEach(function (p) { html += line('Contact · ' + p.name, p); });
                        html += line('Deal pipeline (Agent Acquisition)', r.deal_pipeline);
                        (r.deal_properties || []).forEach(function (p) { html += line('Deal · ' + p.name, p); });
                        html += '</div>';
                        out.innerHTML = html;
                    } catch (e) {
                        out.innerHTML = '<span style="color:#c53030;">Network error: ' + e.message + '</span>';
                    } finally {
                        btn.disabled = false; btn.textContent = orig;
                    }
                }
            </script>

            <!-- Top-level view tabs: the operational inbox vs. the lead-density report. -->
            <div class="view-tabs" style="display:flex;gap:0.25rem;border-bottom:2px solid #edf2f7;margin-bottom:1.5rem;">
                <button id="vt-inbox" class="view-tab active" onclick="showView('inbox')">Central Inbox</button>
                <button id="vt-density" class="view-tab" onclick="showView('density')">Lead Density by Lake</button>
            </div>

            <div id="view-inbox">
            <div class="filter-container">
                <button class="filter-tab active" onclick="filterTable('all', this)">All Leads</button>
                <button class="filter-tab" onclick="filterTable('unassigned', this)">Requires Assignment</button>
                <button class="filter-tab" onclick="filterTable('assigned', this)">Triage Processing</button>
                <div style="border-left: 1px solid #e2e8f0; margin: 0.5rem; height: 20px;"></div>
                <button class="filter-tab" onclick="filterType('buyer', this)">Map Buyers</button>
                <button class="filter-tab" onclick="filterType('seller', this)">Map Sellers</button>
                <button class="filter-tab" onclick="filterType('agent_inquiry', this)">Direct Agent Inquiries</button>
            </div>

            <table class="ledger-table">
                <thead>
                    <tr>
                        <th>Identity Info</th>
                        <th>Lead Type</th>
                        <th>Routing Point</th>
                        <th>Assignment</th>
                        <th>Status</th>
                        <th>Submitted</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- JS Populates this -->
                </tbody>
            </table>
            </div><!-- /view-inbox -->

            <div id="view-density" style="display:none;">
                <iframe id="frame-lead-density" class="sys-frame" data-src="lead-density.html?embed=1" title="Lead Density by Lake"></iframe>
            </div>
        </main>
    </div>

    <script src="../../components/components.js" defer></script>
    <script>
        // Top-level view switch: operational inbox vs. the lead-density report
        // (iframed, auto-grown by admin-embed-host.js). Lazy-loads the iframe.
        function showView(name) {
            document.getElementById('view-inbox').style.display = name === 'inbox' ? '' : 'none';
            document.getElementById('view-density').style.display = name === 'density' ? '' : 'none';
            document.getElementById('vt-inbox').classList.toggle('active', name === 'inbox');
            document.getElementById('vt-density').classList.toggle('active', name === 'density');
            if (name === 'density') { const f = document.getElementById('frame-lead-density'); if (f && !f.src) f.src = f.dataset.src; }
        }

        async function getLeadsData() {
            try {
                const res = await fetch('/api/leads/admin/inbox');
                if(!res.ok) return [];
                return await res.json();
            } catch (err) {
                console.error(err);
                return [];
            }
        }

        function getStatusBadge(status) {
            switch(status) {
                case 'new': return `<span class="s-badge status-new">Fresh Lead</span>`;
                case 'unassigned': return `<span class="s-badge status-unassigned">Unassigned</span>`;
                case 'assigned': return `<span class="s-badge status-assigned">Assigned</span>`;
                case 'in_progress': return `<span class="s-badge status-in_progress">Outreach Working</span>`;
                default: return `<span class="s-badge" style="background:#edf2f7;">${status}</span>`;
            }
        }

        function getTypeBadge(source) {
            switch(source) {
                case 'buyer': return `<span class="s-badge type-buyer">Buyer</span>`;
                case 'seller': return `<span class="s-badge type-seller">Seller</span>`;
                case 'agent_inquiry': return `<span class="s-badge type-agent_inquiry">Agent Explicit</span>`;
                default: return `<span class="s-badge type-general">General Routing</span>`;
            }
        }

        async function renderTable(filterFunc) {
            const body = document.getElementById('tableBody');
            body.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 2rem;">Loading Leads Engine...</td></tr>'; 

            const leadsData = await getLeadsData();
            body.innerHTML = '';
            
            const filtered = leadsData.filter(filterFunc);

            filtered.forEach(l => {
                const tr = document.createElement('tr');
                tr.onclick = () => { window.location.href = `lead-review.html?id=${l.id}`; };
                
                let assignedNameStr = `<span style="font-size:0.8rem; font-style:italic; color:#a0aec0;">Unclaimed</span>`;
                if(l.agent_id) {
                    assignedNameStr = `<span style="font-weight:700; color:#1d6df2;">${l.assigned_agent_name || 'Agent ID: '+l.agent_id}</span>`;
                } else if(l.assigned_user_name) {
                    assignedNameStr = `<span style="font-weight:700; color:#2f855a;">${l.assigned_user_name}</span>`;
                }

                tr.innerHTML = `
                    <td>
                        <div style="font-weight: 700; color: #1a202c; font-size: 1rem;">${l.name}</div>
                        <div style="font-size: 0.8rem; color: #718096;">${l.email ? l.email : 'No Email'} • ${l.phone ? l.phone : 'No Phone'}</div>
                    </td>
                    <td>${getTypeBadge(l.type)}</td>
                    <td style="font-family: inherit; font-size: 0.8rem; font-weight: 600; color: #4a5568;">[${l.source}]</td>
                    <td>${assignedNameStr}</td>
                    <td>${getStatusBadge(l.status)}</td>
                    <td style="color:#a0aec0; font-weight:600; font-size:0.8rem;">${new Date(l.created_at).toLocaleDateString()}</td>
                `;
                body.appendChild(tr);
            });
        }

        function filterTable(status, el) {
            document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            if(status === 'all') renderTable(a => true);
            // "Requires Assignment" = genuinely has NO agent/user on it yet. A
            // fresh lead can already be assigned (e.g. an agent-explicit inquiry
            // routes straight to that agent), so status alone isn't enough —
            // exclude anything that already shows an assignee.
            else if(status === 'unassigned') renderTable(a => !a.agent_id && !a.assigned_user_id && !a.assigned_user_name && ['new', 'unassigned'].includes(a.status));
            else renderTable(a => a.status === status);
        }

        function filterType(source, el) {
            document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            renderTable(a => a.source === source);
        }

        document.addEventListener("DOMContentLoaded", async () => {
            {
            }
            renderTable(a => true);
        });
    </script>
</body>
</html>
