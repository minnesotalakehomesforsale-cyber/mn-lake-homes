<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner Perks | MN Lake Homes Admin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="../../styles/style.css">
    <style>
        html, body { margin: 0; padding: 0; background: #f7f9fa; font-family: 'SF Pro Text', sans-serif; color: #1a202c; }
        .pt-table { width: 100%; background: #fff; border: 1px solid #edf2f7; border-radius: 12px; border-collapse: separate; border-spacing: 0; overflow: hidden; }
        .pt-table th { text-align: left; padding: 0.85rem 1rem; font-size: 0.72rem; font-weight: 800; color: #a0aec0; text-transform: uppercase; letter-spacing: 1px; background: #f7f9fa; border-bottom: 1px solid #edf2f7; }
        .pt-table td { padding: 0.8rem 1rem; font-size: 0.9rem; color: #2d3748; border-bottom: 1px solid #f7f9fa; cursor: pointer; }
        .pt-cat { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; background: #ebf4ff; color: #1d6df2; padding: 0.2rem 0.55rem; border-radius: 6px; }
        .tier-badge { font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; padding: 0.18rem 0.5rem; border-radius: 6px; }
        .tier-free    { background:#e6fffa; color:#234e52; }
        .tier-premium { background:#faf089; color:#744210; }
        .tier-founder { background:#e9d8fd; color:#553c9a; }
        .card { background:#fff; border:1px solid #edf2f7; border-radius:12px; padding:1.4rem; margin-bottom:1.25rem; }
        .card h3 { margin:0 0 1rem; font-size:1.05rem; display:flex; justify-content:space-between; align-items:center; }
        .ovl { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:9000; align-items:center; justify-content:center; padding:1.5rem; }
        .ovl.open { display:flex; }
        .modal { background:#fff; border-radius:16px; width:100%; max-width:560px; max-height:90vh; overflow:auto; box-shadow:0 30px 60px rgba(0,0,0,0.25); }
        .m-hdr { display:flex; justify-content:space-between; align-items:center; padding:1.1rem 1.4rem; border-bottom:1px solid #edf2f7; }
        .m-hdr h2 { margin:0; font-size:1.15rem; }
        .m-close { background:none; border:0; font-size:1.5rem; color:#718096; cursor:pointer; }
        .m-body { padding:1.4rem; }
        .fld { margin-bottom:0.9rem; }
        .fld label { display:block; font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:#4a5568; margin-bottom:0.3rem; }
        .fld input, .fld select, .fld textarea { width:100%; padding:0.6rem 0.8rem; border:1px solid #e2e8f0; border-radius:8px; font:inherit; box-sizing:border-box; }
        .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0.8rem; }
        .btn-primary { background:#1d6df2; color:#fff; border:0; border-radius:8px; padding:0.65rem 1.2rem; font-weight:700; cursor:pointer; }
        .btn-ghost { background:#fff; color:#4a5568; border:1px solid #e2e8f0; border-radius:8px; padding:0.55rem 1rem; font-weight:700; cursor:pointer; }
        .btn-sm { font-size:0.8rem; padding:0.4rem 0.8rem; }
        .btn-danger { background:#fff; color:#c53030; border:1px solid #fc8181; }
        .err { display:none; background:#fff5f5; color:#c53030; border:1px solid #feb2b2; padding:0.6rem 0.85rem; border-radius:8px; margin-bottom:0.9rem; font-weight:600; font-size:0.88rem; }
        .empty { padding:3rem; text-align:center; color:#a0aec0; }
        .row-item { display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; padding:0.8rem 0; border-bottom:1px solid #f7f9fa; }
        .row-item:last-child { border-bottom:0; }
        .muted { color:#718096; font-size:0.85rem; }
        .link { color:#1d6df2; text-decoration:none; font-weight:600; }
    </style>
    <script src="../../components/admin-guard.js"></script>
    <script src="../../components/admin-responsive.js" defer></script>
    <script src="../../components/admin-sidebar.js" defer></script>
    <script src="../../components/admin-assistant.js" defer></script>
</head>
<body>
    <div class="admin-wrap">
        <admin-sidebar active="partner-perks"></admin-sidebar>
        <main class="admin-main">
            <header style="margin-bottom:1.5rem;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:1rem;">
                <div>
                    <h1 id="hdr-title" style="font-size:1.85rem;font-weight:800;letter-spacing:-0.75px;margin:0 0 0.25rem;">Partner Perks</h1>
                    <p id="hdr-sub" style="color:#718096;font-size:0.95rem;margin:0;max-width:640px;">Your vendor network — website builders, photographers, title companies and more — offering tiered discounts to agents as a membership benefit. Offers gate by plan: all tiers, Premium+, or Founder-only.</p>
                </div>
                <div id="hdr-actions"><button class="btn-primary" onclick="openNewCompany()">+ Add company</button></div>
            </header>
            <div id="wrap"><div class="empty">Loading…</div></div>
        </main>
    </div>

    <!-- Company add/edit modal -->
    <div id="modal" class="ovl" onclick="if(event.target===this)closeModal()">
        <div class="modal">
            <div class="m-hdr"><h2 id="m-title">Add company</h2><button class="m-close" onclick="closeModal()">×</button></div>
            <div class="m-body">
                <div id="err" class="err"></div>
                <input type="hidden" id="f-id">
                <div class="fld"><label>Company name *</label><input id="f-company_name"></div>
                <div class="grid2">
                    <div class="fld"><label>Category</label><input id="f-category" placeholder="Website Builder, Photographer…"></div>
                    <div class="fld"><label>Status</label><select id="f-status"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
                </div>
                <div class="grid2">
                    <div class="fld"><label>Website URL</label><input id="f-website_url" placeholder="https://…"></div>
                    <div class="fld"><label>Logo URL</label><input id="f-logo_url" placeholder="https://…"></div>
                </div>
                <div class="fld"><label>Summary (what they do / why they're in the network)</label><textarea id="f-summary" rows="3"></textarea></div>
                <div style="display:flex;gap:0.6rem;justify-content:flex-end;">
                    <button class="btn-ghost" onclick="closeModal()">Cancel</button>
                    <button class="btn-primary" onclick="saveCompany()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Offer add/edit modal -->
    <div id="offer-modal" class="ovl" onclick="if(event.target===this)closeOfferModal()">
        <div class="modal">
            <div class="m-hdr"><h2 id="om-title">Add offer</h2><button class="m-close" onclick="closeOfferModal()">×</button></div>
            <div class="m-body">
                <div id="offer-err" class="err"></div>
                <input type="hidden" id="o-id">
                <div class="fld"><label>Offer title *</label><input id="o-title" placeholder="20% off a custom agent website"></div>
                <div class="fld"><label>Value / details</label><textarea id="o-value_text" rows="2" placeholder="What the agent gets, any fine print"></textarea></div>
                <div class="grid2">
                    <div class="fld"><label>Available to</label><select id="o-min_tier"><!-- populated from real membership tiers --></select></div>
                    <div class="fld"><label>How to redeem</label><select id="o-redeem_type" onchange="toggleRedeem()">
                        <option value="request">Request through me</option>
                        <option value="link">Special link</option>
                    </select></div>
                </div>
                <div class="fld" id="o-link-fld" style="display:none;"><label>Redeem link</label><input id="o-redeem_link" placeholder="https://…"></div>
                <div class="fld"><label>Redeem instructions (shown to eligible agents)</label><textarea id="o-redeem_instructions" rows="2" placeholder="e.g. Reply to the perk and I'll make the intro"></textarea></div>
                <div style="display:flex;gap:0.6rem;justify-content:flex-end;">
                    <button class="btn-ghost" onclick="closeOfferModal()">Cancel</button>
                    <button class="btn-primary" onclick="saveOffer()">Save offer</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        const esc = s => String(s ?? '').replace(/[<>&"]/g, c => ({ '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;' }[c]));
        let _tiers = [];      // [{code,name,sort_priority}] lowest tier first — from the DB
        let current = null;   // loaded company detail

        // Cumulative label: min_tier X means "tier X and everyone above it can redeem".
        function tierLabel(code) {
            const i = _tiers.findIndex(t => t.code === code);
            if (i < 0) return code;
            if (i === 0) return 'All agents';
            if (i === _tiers.length - 1) return _tiers[i].name + ' only';
            return _tiers[i].name + ' & up';
        }
        async function loadTiers() {
            try { _tiers = await api('/tiers'); } catch (_) { _tiers = []; }
            const sel = $('o-min_tier');
            if (sel) sel.innerHTML = _tiers.map(t => `<option value="${t.code}">${esc(tierLabel(t.code))}</option>`).join('');
        }

        async function api(path, opts) {
            const res = await fetch('/api/admin/partner-perks' + path, { credentials:'include', ...opts });
            if (!res.ok) { const d = await res.json().catch(()=>({})); throw new Error(d.error || `HTTP ${res.status}`); }
            return res.status === 204 ? null : res.json();
        }

        // ── List ──
        async function loadList() {
            $('hdr-title').textContent = 'Partner Perks';
            $('hdr-actions').innerHTML = '<button class="btn-primary" onclick="openNewCompany()">+ Add company</button>';
            const wrap = $('wrap');
            wrap.innerHTML = '<div class="empty">Loading…</div>';
            try {
                const rows = await api('');
                if (!rows.length) { wrap.innerHTML = '<div class="empty">No partners yet. Add your first company.</div>'; return; }
                wrap.innerHTML = `<table class="pt-table"><thead><tr>
                    <th>Company</th><th>Category</th><th>Offers</th><th>Status</th></tr></thead><tbody>
                    ${rows.map(c => `<tr onclick="loadDetail('${c.id}')">
                        <td style="font-weight:700;">${esc(c.company_name)}</td>
                        <td>${c.category ? `<span class="pt-cat">${esc(c.category)}</span>` : '<span class="muted">—</span>'}</td>
                        <td>${c.offer_count}</td>
                        <td>${c.status === 'active' ? '<span style="color:#2f855a;font-weight:700;">Active</span>' : '<span class="muted">Inactive</span>'}</td>
                    </tr>`).join('')}</tbody></table>`;
            } catch (e) { wrap.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
        }

        // ── Detail ──
        async function loadDetail(id) {
            const wrap = $('wrap');
            wrap.innerHTML = '<div class="empty">Loading…</div>';
            try {
                const c = await api('/' + id);
                current = c;
                $('hdr-title').textContent = c.company_name;
                $('hdr-actions').innerHTML = `<button class="btn-ghost" onclick="loadList()">← All partners</button>
                    <button class="btn-ghost btn-sm" onclick="openEditCompany()">Edit</button>`;
                wrap.innerHTML = `
                    <div class="card">
                        <h3>Profile</h3>
                        <p class="muted" style="margin:0 0 0.5rem;">${esc(c.summary || 'No summary yet.')}</p>
                        <div style="display:flex;gap:1.5rem;flex-wrap:wrap;font-size:0.88rem;">
                            ${c.category ? `<span><strong>Category:</strong> ${esc(c.category)}</span>` : ''}
                            ${c.website_url ? `<span><strong>Website:</strong> <a class="link" href="${esc(c.website_url)}" target="_blank" rel="noopener">${esc(c.website_url)}</a></span>` : ''}
                            <span><strong>Status:</strong> ${esc(c.status)}</span>
                        </div>
                    </div>
                    ${sectionOffers(c)}
                    ${sectionContacts(c)}
                    ${sectionFiles(c)}
                    ${sectionNotes(c)}
                    <div style="margin-top:1rem;"><button class="btn-ghost btn-danger btn-sm" onclick="deleteCompany('${c.id}')">Delete company</button></div>`;
            } catch (e) { wrap.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
        }

        function sectionOffers(c) {
            return `<div class="card"><h3>Offers <button class="btn-primary btn-sm" onclick="openNewOffer()">+ Add offer</button></h3>
                ${(c.offers||[]).length ? c.offers.map(o => `<div class="row-item">
                    <div>
                        <div style="font-weight:700;">${esc(o.title)} <span class="tier-badge tier-${esc(o.min_tier)}">${esc(tierLabel(o.min_tier))}</span> ${o.is_active ? '' : '<span class="muted">(inactive)</span>'}</div>
                        <div class="muted">${esc(o.value_text || '')}</div>
                        <div class="muted" style="font-size:0.8rem;">Redeem: ${o.redeem_type === 'link' ? `<a class="link" href="${esc(o.redeem_link||'')}" target="_blank" rel="noopener">special link</a>` : 'request through admin'}</div>
                    </div>
                    <div style="display:flex;gap:0.4rem;white-space:nowrap;">
                        <button class="btn-ghost btn-sm" onclick='openEditOffer(${JSON.stringify(o)})'>Edit</button>
                        <button class="btn-ghost btn-sm btn-danger" onclick="deleteOffer('${o.id}')">×</button>
                    </div></div>`).join('') : '<div class="muted">No offers yet.</div>'}</div>`;
        }
        function sectionContacts(c) {
            return `<div class="card"><h3>Contacts <button class="btn-ghost btn-sm" onclick="addContact()">+ Add</button></h3>
                ${(c.contacts||[]).length ? c.contacts.map(x => `<div class="row-item">
                    <div><div style="font-weight:700;">${esc(x.name)} ${x.role?`<span class="muted">· ${esc(x.role)}</span>`:''}</div>
                    <div class="muted">${[x.email,x.phone].filter(Boolean).map(esc).join(' · ')||'—'}</div>${x.notes?`<div class="muted">${esc(x.notes)}</div>`:''}</div>
                    <button class="btn-ghost btn-sm btn-danger" onclick="deleteContact('${x.id}')">×</button></div>`).join('') : '<div class="muted">No contacts yet.</div>'}</div>`;
        }
        function sectionFiles(c) {
            return `<div class="card"><h3>Contracts &amp; files <label class="btn-ghost btn-sm" style="cursor:pointer;">+ Upload<input type="file" style="display:none;" onchange="uploadFile(this)"></label></h3>
                <div id="file-msg" class="muted" style="margin-bottom:0.5rem;"></div>
                ${(c.files||[]).length ? c.files.map(f => `<div class="row-item">
                    <a class="link" href="${esc(f.file_url)}" target="_blank" rel="noopener">${esc(f.file_name||'file')}</a>
                    <button class="btn-ghost btn-sm btn-danger" onclick="deleteFile('${f.id}')">×</button></div>`).join('') : '<div class="muted">No files yet.</div>'}</div>`;
        }
        function sectionNotes(c) {
            return `<div class="card"><h3>Notes</h3>
                <textarea id="note-input" rows="2" style="width:100%;padding:0.6rem;border:1px solid #e2e8f0;border-radius:8px;box-sizing:border-box;" placeholder="Internal note…"></textarea>
                <div style="text-align:right;margin:0.5rem 0 1rem;"><button class="btn-ghost btn-sm" onclick="addNote()">Add note</button></div>
                ${(c.notes||[]).length ? c.notes.map(n => `<div class="row-item"><div><div>${esc(n.note_body)}</div>
                    <div class="muted" style="font-size:0.78rem;">${esc(n.author||'admin')} · ${new Date(n.created_at).toLocaleDateString()}</div></div>
                    <button class="btn-ghost btn-sm btn-danger" onclick="deleteNote('${n.id}')">×</button></div>`).join('') : '<div class="muted">No notes yet.</div>'}</div>`;
        }

        // ── Company modal ──
        function openNewCompany() { $('m-title').textContent='Add company'; $('err').style.display='none';
            ['id','company_name','category','website_url','logo_url','summary'].forEach(k=>$('f-'+k).value=''); $('f-status').value='active'; $('modal').classList.add('open'); }
        function openEditCompany() { const c=current; $('m-title').textContent='Edit company'; $('err').style.display='none';
            $('f-id').value=c.id; $('f-company_name').value=c.company_name||''; $('f-category').value=c.category||'';
            $('f-website_url').value=c.website_url||''; $('f-logo_url').value=c.logo_url||''; $('f-summary').value=c.summary||''; $('f-status').value=c.status||'active';
            $('modal').classList.add('open'); }
        function closeModal(){ $('modal').classList.remove('open'); }
        async function saveCompany() {
            const id=$('f-id').value;
            const body={ company_name:$('f-company_name').value, category:$('f-category').value, website_url:$('f-website_url').value,
                logo_url:$('f-logo_url').value, summary:$('f-summary').value, status:$('f-status').value };
            try {
                const saved = await api(id?('/'+id):'', { method:id?'PATCH':'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
                closeModal(); id ? loadDetail(id) : loadDetail(saved.id);
            } catch(e){ $('err').textContent=e.message; $('err').style.display='block'; }
        }
        async function deleteCompany(id){ if(!confirm('Delete this company and all its offers/contacts/notes/files?'))return;
            try{ await api('/'+id,{method:'DELETE'}); loadList(); }catch(e){ alert(e.message); } }

        // ── Offer modal ──
        function toggleRedeem(){ $('o-link-fld').style.display = $('o-redeem_type').value==='link'?'':'none'; }
        function openNewOffer(){ $('om-title').textContent='Add offer'; $('offer-err').style.display='none';
            ['id','title','value_text','redeem_link','redeem_instructions'].forEach(k=>$('o-'+k).value=''); if(_tiers[0]) $('o-min_tier').value=_tiers[0].code; $('o-redeem_type').value='request'; toggleRedeem(); $('offer-modal').classList.add('open'); }
        function openEditOffer(o){ $('om-title').textContent='Edit offer'; $('offer-err').style.display='none';
            $('o-id').value=o.id; $('o-title').value=o.title||''; $('o-value_text').value=o.value_text||''; $('o-min_tier').value=o.min_tier||'free';
            $('o-redeem_type').value=o.redeem_type||'request'; $('o-redeem_link').value=o.redeem_link||''; $('o-redeem_instructions').value=o.redeem_instructions||''; toggleRedeem(); $('offer-modal').classList.add('open'); }
        function closeOfferModal(){ $('offer-modal').classList.remove('open'); }
        async function saveOffer(){
            const oid=$('o-id').value;
            const body={ title:$('o-title').value, value_text:$('o-value_text').value, min_tier:$('o-min_tier').value,
                redeem_type:$('o-redeem_type').value, redeem_link:$('o-redeem_link').value, redeem_instructions:$('o-redeem_instructions').value };
            try{ await api(`/${current.id}/offers${oid?('/'+oid):''}`, { method:oid?'PATCH':'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
                closeOfferModal(); loadDetail(current.id);
            }catch(e){ $('offer-err').textContent=e.message; $('offer-err').style.display='block'; }
        }
        async function deleteOffer(oid){ if(!confirm('Delete this offer?'))return; try{ await api(`/${current.id}/offers/${oid}`,{method:'DELETE'}); loadDetail(current.id); }catch(e){ alert(e.message); } }

        // ── Contacts / notes / files ──
        async function addContact(){ const name=prompt('Contact name'); if(!name)return; const role=prompt('Role (optional)')||'';
            const email=prompt('Email (optional)')||''; const phone=prompt('Phone (optional)')||'';
            try{ await api(`/${current.id}/contacts`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,role,email,phone})}); loadDetail(current.id);}catch(e){alert(e.message);} }
        async function deleteContact(id){ try{ await api(`/${current.id}/contacts/${id}`,{method:'DELETE'}); loadDetail(current.id);}catch(e){alert(e.message);} }
        async function addNote(){ const body=$('note-input').value.trim(); if(!body)return;
            try{ await api(`/${current.id}/notes`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({note_body:body})}); loadDetail(current.id);}catch(e){alert(e.message);} }
        async function deleteNote(id){ try{ await api(`/${current.id}/notes/${id}`,{method:'DELETE'}); loadDetail(current.id);}catch(e){alert(e.message);} }
        async function uploadFile(input){ const file=input.files[0]; if(!file)return; $('file-msg').textContent='Uploading…';
            const fd=new FormData(); fd.append('file',file);
            try{ await fetch(`/api/admin/partner-perks/${current.id}/files`,{method:'POST',credentials:'include',body:fd}).then(r=>{if(!r.ok)throw new Error('Upload failed');}); loadDetail(current.id);}catch(e){ $('file-msg').textContent=e.message; } }
        async function deleteFile(id){ try{ await api(`/${current.id}/files/${id}`,{method:'DELETE'}); loadDetail(current.id);}catch(e){alert(e.message);} }

        loadTiers();
        loadList();
    </script>
</body>
</html>
