<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO Health | MN Lake Homes Admin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="../../styles/style.css">
    <style>
        html, body { margin: 0; padding: 0; background: #f6f8fb; font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, sans-serif; color: #0f172a; }

        /* Embed mode (?embed=1): iframed inside Metrics & Database. */
        body.lt-embed admin-sidebar,
        body.lt-embed .admin-main > header { display: none !important; }
        body.lt-embed .admin-wrap { display: block !important; }
        body.lt-embed .admin-main { padding: 0 !important; margin: 0 !important; max-width: none !important; }

        .seo-head h1 { font-size: 1.85rem; font-weight: 800; letter-spacing: -0.75px; margin: 0 0 0.25rem; }
        .seo-head p { color: #64748b; font-size: 0.95rem; margin: 0; max-width: 66ch; line-height: 1.55; }

        .wrap { max-width: 1080px; }

        /* ── Hero verdict banner ─────────────────────────────────────────── */
        .verdict { display: flex; align-items: center; gap: 1.25rem; border-radius: 18px; padding: 1.5rem 1.75rem; margin: 0 0 1.5rem; border: 1px solid transparent; }
        .verdict.ok   { background: linear-gradient(135deg,#ecfdf5,#f0fdf4); border-color: #bbf7d0; }
        .verdict.warn { background: linear-gradient(135deg,#fffbeb,#fff7ed); border-color: #fed7aa; }
        .verdict-ico { flex: none; width: 54px; height: 54px; border-radius: 14px; display: grid; place-items: center; }
        .verdict.ok .verdict-ico   { background: #16a34a; }
        .verdict.warn .verdict-ico { background: #d97706; }
        .verdict-ico svg { width: 28px; height: 28px; stroke: #fff; fill: none; stroke-width: 2.4; }
        .verdict h2 { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.5px; margin: 0 0 0.15rem; }
        .verdict.ok h2   { color: #14532d; }
        .verdict.warn h2 { color: #7c2d12; }
        .verdict p { margin: 0; font-size: 0.92rem; line-height: 1.5; color: #475569; }
        .verdict .score { margin-left: auto; text-align: center; padding-left: 1.25rem; border-left: 1px solid rgba(15,23,42,0.08); }
        .verdict .score .v { font-size: 2.1rem; font-weight: 800; letter-spacing: -1.5px; line-height: 1; font-variant-numeric: tabular-nums; }
        .verdict.ok .score .v   { color: #16a34a; }
        .verdict.warn .score .v { color: #d97706; }
        .verdict .score .k { font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; color: #94a3b8; margin-top: 0.3rem; }
        @media (max-width: 640px) { .verdict { flex-wrap: wrap; } .verdict .score { margin: 0; padding: 0.75rem 0 0; border-left: 0; border-top: 1px solid rgba(15,23,42,0.08); width: 100%; display: flex; gap: 0.6rem; align-items: baseline; justify-content: flex-start; } .verdict .score .k { margin: 0; } }

        /* ── Group heading ───────────────────────────────────────────────── */
        .group-h { display: flex; align-items: center; gap: 0.6rem; margin: 2rem 0 0.9rem; }
        .group-h:first-of-type { margin-top: 0.5rem; }
        .group-h .gi { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: #eef4ff; }
        .group-h .gi svg { width: 17px; height: 17px; stroke: #1d6df2; fill: none; stroke-width: 2.2; }
        .group-h h2 { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.4px; margin: 0; }

        /* ── Stat cards ──────────────────────────────────────────────────── */
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.25rem; }
        @media (max-width: 720px) { .stats { grid-template-columns: 1fr; } }
        .stat { position: relative; background: #fff; border: 1px solid #e9eef5; border-radius: 14px; padding: 1.15rem 1.3rem; box-shadow: 0 1px 2px rgba(16,24,40,0.03); overflow: hidden; }
        .stat::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
        .stat.bad::before  { background: #dc2626; } .stat.warn::before { background: #d97706; }
        .stat.good::before { background: #16a34a; } .stat.mut::before  { background: #cbd5e1; }
        .stat .n { font-size: 2.1rem; font-weight: 800; letter-spacing: -1.2px; line-height: 1; font-variant-numeric: tabular-nums; }
        .stat.bad .n { color: #dc2626; } .stat.warn .n { color: #d97706; } .stat.good .n { color: #16a34a; } .stat.mut .n { color: #64748b; }
        .stat .l { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.7px; color: #94a3b8; margin-top: 0.45rem; }
        .stat .sub { font-size: 0.78rem; color: #94a3b8; margin-top: 0.2rem; }

        /* ── Panels (issue tables) ───────────────────────────────────────── */
        .panel { background: #fff; border: 1px solid #e9eef5; border-radius: 14px; margin-bottom: 1.1rem; overflow: hidden; box-shadow: 0 1px 2px rgba(16,24,40,0.03); }
        .panel-hd { display: flex; align-items: center; gap: 0.6rem; padding: 0.95rem 1.4rem; border-bottom: 1px solid #eef2f7; }
        .panel-hd .dot { width: 9px; height: 9px; border-radius: 99px; flex: none; }
        .dot.bad { background: #dc2626; } .dot.warn { background: #d97706; } .dot.good { background: #16a34a; }
        .panel-hd h3 { font-size: 0.95rem; font-weight: 800; margin: 0; letter-spacing: -0.2px; }
        .panel-hd .count { margin-left: auto; font-size: 0.72rem; font-weight: 800; padding: 0.2rem 0.6rem; border-radius: 99px; }
        .count.bad { background: #fef2f2; color: #dc2626; } .count.warn { background: #fffbeb; color: #d97706; } .count.good { background: #f0fdf4; color: #16a34a; }
        .panel-bd { padding: 0.35rem 0.5rem 0.5rem; }

        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { text-align: left; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.6px; color: #94a3b8; font-weight: 800; padding: 0.7rem 0.9rem 0.55rem; }
        td { padding: 0.7rem 0.9rem; border-top: 1px solid #f1f5f9; vertical-align: middle; }
        tbody tr:hover { background: #f8fafc; }
        td .pg-name { font-weight: 700; color: #0f172a; }
        .badge { display: inline-block; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 6px; padding: 0.1rem 0.5rem; font-size: 0.72rem; color: #475569; margin: 0.1rem 0.3rem 0.1rem 0; font-weight: 600; }
        .viewlink { display: inline-flex; align-items: center; gap: 0.25rem; color: #1d6df2; font-weight: 700; font-size: 0.82rem; text-decoration: none; white-space: nowrap; }
        .viewlink:hover { text-decoration: underline; }
        td.right { text-align: right; }

        .ok-state { display: flex; align-items: center; gap: 0.6rem; padding: 1rem 1.4rem; color: #15803d; font-weight: 600; font-size: 0.9rem; }
        .ok-state svg { width: 18px; height: 18px; stroke: #16a34a; fill: none; stroke-width: 2.4; flex: none; }

        .footnote { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 12px; padding: 0.85rem 1.15rem; font-size: 0.83rem; line-height: 1.6; color: #64748b; margin: 0.5rem 0 0; }
        .muted { color: #94a3b8; }
    </style>
    <script src="../../components/admin-guard.js"></script>
    <script src="../../components/admin-sidebar.js" defer></script>
    <script src="../../components/admin-responsive.js" defer></script>
</head>
<body>
<div class="admin-wrap">
    <admin-sidebar active="system"></admin-sidebar>
    <main class="admin-main">
        <header class="seo-head" style="margin-bottom:1.75rem;">
            <h1>SEO Health</h1>
            <p>Which lake &amp; town pages are hurting your search visibility — live from your database.</p>
        </header>

        <div class="wrap">
            <div id="seo-body"><p class="muted" style="padding:1.5rem 0;">Running audit…</p></div>
        </div>
    </main>
</div>

<script>
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    if (new URLSearchParams(location.search).get('embed') === '1') document.body.classList.add('lt-embed');

    const ICON = {
        check: '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
        alert: '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
        lake:  '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6c2 0 2 1.5 4 1.5S8 6 10 6s2 1.5 4 1.5S16 6 18 6s2 1.5 4 1.5"/><path d="M2 12c2 0 2 1.5 4 1.5S8 12 10 12s2 1.5 4 1.5 2-1.5 4-1.5 2 1.5 4 1.5"/><path d="M2 18c2 0 2 1.5 4 1.5S8 18 10 18s2 1.5 4 1.5 2-1.5 4-1.5 2 1.5 4 1.5"/></svg>',
        town:  '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l6-4v18"/><path d="M11 9h6a2 2 0 0 1 2 2v10"/><path d="M8 9v.01M8 12v.01M8 15v.01"/></svg>',
    };

    function issueCells(x) {
        if (x.reason) return `<span class="badge">${esc(x.reason)}</span>`;
        const arr = x.issues || [];
        return arr.length ? arr.map(i => `<span class="badge">${esc(i)}</span>`).join('') : '<span class="muted">—</span>';
    }

    function table(kind, items) {
        return `<table><thead><tr><th>Page</th><th>Issue</th><th class="right">Open</th></tr></thead><tbody>${items.map(x => `
            <tr>
                <td><span class="pg-name">${esc(x.name)}</span></td>
                <td>${issueCells(x)}</td>
                <td class="right"><a class="viewlink" href="/${kind}/${encodeURIComponent(x.slug)}" target="_blank" rel="noopener">/${kind}/${esc(x.slug)} <span aria-hidden="true">↗</span></a></td>
            </tr>`).join('')}</tbody></table>`;
    }

    function panel(tone, title, items, kind) {
        const n = items.length;
        return `<div class="panel">
            <div class="panel-hd"><span class="dot ${tone}"></span><h3>${esc(title)}</h3><span class="count ${n ? tone : 'good'}">${n}</span></div>
            ${n ? `<div class="panel-bd">${table(kind, items)}</div>`
                : `<div class="ok-state">${ICON.check} None — all good here.</div>`}
        </div>`;
    }

    function stat(tone, n, label, sub) {
        return `<div class="stat ${tone}"><div class="n">${n}</div><div class="l">${esc(label)}</div>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div>`;
    }

    (async () => {
        const body = document.getElementById('seo-body');
        let data;
        try {
            const res = await fetch('/api/admin/seo-audit', { credentials: 'include' });
            if (res.status === 401 || res.status === 403) { body.innerHTML = '<p class="muted">Please sign in as an admin to view this.</p>'; return; }
            data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Audit failed');
        } catch (e) {
            body.innerHTML = `<p style="color:#dc2626;padding:1rem 0;">Could not run the audit: ${esc(e.message)}</p>`;
            return;
        }

        const L = data.lakes, T = data.towns;
        const attn = T.needs_attention || [];
        const actionable = L.invisible.length + attn.length;
        const ok = actionable === 0;

        // Verdict banner.
        const verdict = `<div class="verdict ${ok ? 'ok' : 'warn'}">
            <div class="verdict-ico">${ok ? ICON.check : ICON.alert}</div>
            <div>
                <h2>${ok ? 'Everything that should be indexed is live' : `${actionable} page${actionable === 1 ? '' : 's'} need attention`}</h2>
                <p>${ok
                    ? `All lakes and curated lake-towns render and sit in your sitemap. ${T.geo_only} inactive geo-tags are routing-only by design — correctly kept out of Google.`
                    : `Lakes or curated lake-towns that should be live but aren't — usually a missing hero image, unpublished, or no linked lake. The ${T.geo_only} inactive geo-tags are intentional routing tags, not broken pages.`}</p>
            </div>
            <div class="score"><div class="v">${actionable}</div><div class="k">Need fixing</div></div>
        </div>`;

        // Lakes group.
        const lakes = `
            <div class="group-h"><span class="gi">${ICON.lake}</span><h2>Lakes</h2></div>
            <div class="stats">
                ${stat('bad',  L.invisible.length, 'Invisible', '404 to Google')}
                ${stat('warn', L.thin.length,      'Thin content', 'renders but weak')}
                ${stat('good', L.solid,            'Solid', `of ${L.total} total`)}
            </div>
            ${panel('bad',  'Invisible — can\'t rank at all', L.invisible, 'lakes')}
            ${panel('warn', 'Thin content — weak on the page', L.thin, 'lakes')}`;

        // Towns group.
        const towns = `
            <div class="group-h"><span class="gi">${ICON.town}</span><h2>Towns</h2></div>
            <div class="stats">
                ${stat('good', T.live,          'Live lake-towns', 'indexable')}
                ${stat('warn', attn.length,     'Curated, not live', 'should be up')}
                ${stat('mut',  T.geo_only,      'Geo-only tags', 'routing, not pages')}
            </div>
            ${panel('warn', 'Curated but not live', attn, 'towns')}
            ${(T.thin || []).length ? panel('warn', 'Thin content', T.thin, 'towns') : ''}
            <p class="footnote"><strong>${T.geo_only}</strong> geo-only tags route leads (non-lake suburbs) and <strong>${T.out_of_state || 0}</strong> are out-of-state cities (ND/WI). Both are intentionally kept out of Google — the live count above is <strong>Minnesota lake-towns only</strong>.</p>`;

        body.innerHTML = verdict + lakes + towns;
    })();
</script>
</body>
</html>
